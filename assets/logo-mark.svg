<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512"
     role="img" aria-label="Halo">
  <title>Halo</title>
  <!-- The mark exactly as the site uses it: one open ring, stroke 1/8 of the
       canvas, radius 11/32. Transparent background, no effects. -->
  <defs>
    <linearGradient id="halo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2547D6"/>
      <stop offset="45%" stop-color="#7B3FC9"/>
      <stop offset="100%" stop-color="#B87D0F"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#halo)" stroke-width="8"/>
</svg>
